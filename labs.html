<style>:root{
  /* Bruecke auf das Design-System — die alten Namen dieser Seite zeigen
     jetzt auf die Tokens aus assets/css/nf.css. */
  --gold: var(--signal);
  --gold-light: var(--signal-deep);
  --gold-dark: var(--signal);
  --black: var(--paper);
  --white: var(--ink);
  --white-muted: var(--ink-2);
  --white-subtle: var(--ink-3);
  --gradient: linear-gradient(135deg, var(--signal), var(--signal-deep));
}


.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.6rem,7vw,4.5rem);font-weight:300;line-height:1.05;margin-bottom:22px}
h1 span{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:400}
p{color:var(--ink-2);max-width:520px;font-size:1.05rem;line-height:1.8;margin-bottom:40px}
.actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:9px;padding:15px 32px;font-size:.8rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;border:1px solid var(--gold);transition:all .4s ease}
.btn.solid{background:var(--gold);color:var(--on-signal)}.btn.solid:hover{background:transparent;color:var(--gold)}
.btn.ghost{color:var(--ink);border-color:var(--signal)}.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.back{position:fixed;top:30px;left:30px;display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);text-decoration:none;font-size:.78rem;letter-spacing:1px;text-transform:uppercase;transition:color .3s}
.back svg{width:16px;height:16px;stroke:var(--gold)}.back:hover{color:var(--gold)}</style>
