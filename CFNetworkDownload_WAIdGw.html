<!DOCTYPE html>

<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden | NobleFrame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #C9A962; --black: #0A0A0A; --white: #FAFAFA; --gray: #888888; --font-display: 'Cormorant Garamond', serif; --font-body: 'Montserrat', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background: var(--black); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .logo { font-family: var(--font-display); font-size: 32px; color: var(--white); text-decoration: none; margin-bottom: 60px; }
        .logo span { color: var(--gold); }
        .error-code { font-family: var(--font-display); font-size: clamp(120px, 20vw, 200px); color: var(--gold); line-height: 1; margin-bottom: 20px; }
        h1 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 42px); font-weight: 400; margin-bottom: 20px; }
        p { color: var(--gray); font-size: 16px; max-width: 400px; margin-bottom: 40px; }
        .btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 40px; font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; text-decoration: none; background: var(--gold); color: var(--black); transition: all 0.3s ease; }
        .btn:hover { background: #E8D5A3; transform: translateY(-2px); }
        .links { margin-top: 40px; display: flex; gap: 30px; }
        .links a { color: var(--gray); text-decoration: none; font-size: 14px; transition: color 0.3s; }
        .links a:hover { color: var(--gold); }
    </style>
</head>
<body>
    <a href="index.html" class="logo">Noble<span>Frame</span></a>
    <div class="error-code">404</div>
    <h1>Seite nicht gefunden</h1>
    <p>Die angeforderte Seite existiert leider nicht oder wurde verschoben.</p>
    <a href="index.html" class="btn">Zur Startseite</a>
    <div class="links">
        <a href="kontakt.html">Kontakt</a>
        <a href="referenzen.html">Referenzen</a>
        <a href="faq.html">FAQ</a>
    </div>
<!-- Cookie Consent Banner (DSGVO) -->
    <script src="js/cookie-consent.js"></script>
</body>
</html>
